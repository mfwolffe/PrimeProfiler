[package]
name = "rust-prime-profiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "main"
path = "src/main.rs"

[lib]
name = "rust_prime_profiler"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
lto = false
panic = "unwind"
codegen-units = 1

[profile.release]
opt-level = 3
debug = true
overflow-checks = false
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.fast]
inherits = "release"
opt-level = 3
lto = "fat"  
codegen-units = 1
panic = "abort"